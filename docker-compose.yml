services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"   # 5434 en mi PC: el 5432 y el 5433 los usa el Postgres instalado en Windows
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro   # corre los .sql la PRIMERA vez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8080:80"     # solo IPv4: en Windows "localhost" por IPv6 se cuelga con Docker
    volumes:
      - ./backend:/var/www/html   # edito en mi PC y se ve al instante en el contenedor
    depends_on:
      db:
        condition: service_healthy   # espero a que Postgres esté listo

volumes:
  pgdata: