name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (PHP + PostgreSQL)
    runs-on: ubuntu-latest

    # Base real para los tests de integración, igual que el Docker local
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: portal
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portal -d portal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal_ci
      # Clave solo para CI (no es un secreto real: firma tokens de prueba)
      JWT_SECRET: clave_solo_para_ci_de_al_menos_32_caracteres_xx
      JWT_TTL_MIN: 60
      APP_ENV: local

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none

      - name: Crear schema y datos de prueba
        env:
          PGPASSWORD: portal_ci
        run: |
          psql -h localhost -U portal -d portal -v ON_ERROR_STOP=1 -f ../db/001_schema.sql
          psql -h localhost -U portal -d portal -v ON_ERROR_STOP=1 -f ../db/002_seed.sql

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Auditoría de dependencias (SCA)
        run: composer audit

      - name: Tests (PHPUnit)
        run: vendor/bin/phpunit --testdox

  frontend:
    name: Frontend (Vue 3)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # Vite 8 necesita Node 22.18+ (ver "engines" en package.json)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # En CI corremos los linters SIN --fix: tienen que avisar, no corregir
      - name: Lint
        run: |
          npx oxlint .
          npx eslint .

      - name: Chequeo de tipos
        run: npm run type-check

      - name: Tests (Vitest)
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build-only

      - name: Auditoría de dependencias (SCA)
        run: npm audit --audit-level=high
